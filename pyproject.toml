[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "f1-marl"
version = "0.1.0"
description = "A multi-agent reinforcement learning research environment for competitive autonomous formula-style racing."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "F1-MARL Contributors" }]
dependencies = [
    "numpy>=1.26,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
]
simulation = [
    "pygame>=2.5,<3.0",
    "gymnasium>=0.29,<2.0",
    "pettingzoo>=1.24,<2.0",
]
rl = [
    "torch>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/f1_marl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
