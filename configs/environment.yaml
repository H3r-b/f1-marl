# Initial configuration contract. Values will be consumed by the simulator
# as those components are implemented.
environment:
  name: f1_marl
  num_agents: 4
  max_episode_steps: 5000
  control_frequency_hz: 20
  random_seed: 42

track:
  name: development_circuit
  coordinate_system: frenet
  enforce_track_limits: true

vehicle:
  model: kinematic_bicycle
  mass_kg: 800.0
  wheelbase_m: 3.6
  max_steering_angle_rad: 0.55
  max_acceleration_mps2: 9.0
  max_braking_mps2: 12.0
  max_speed_mps: 90.0
